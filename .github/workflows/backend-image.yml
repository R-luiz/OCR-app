name: Backend image

on:
  push:
    branches: ["**"]
    # Only the files that actually end up in the image. Rebuilding is a ~25 minute,
    # ~8.8 GB job, so it must not fire for changes to the deploy or test scripts,
    # which the Dockerfile never copies.
    paths:
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/handler.py"
      - "backend/ocr_logits.py"
      - "backend/postprocess.py"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

# A newer push to the same ref supersedes a build still in flight, so two builds never
# race for the same tags.
concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The worker's own pinned requirements, so the tests run the library versions
      # the image ships.
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt pytest==9.2.0

      - name: Unit tests
        run: python -m pytest test_handler.py test_postprocess.py -q
        working-directory: backend

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The vLLM base image is very large (CUDA runtime + torch), and the build now
      # also downloads ~6.7 GB of model weights into a layer. A stock runner has
      # ~14 GB free, which is not enough; this reclaims disk space.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker system prune --all --force --volumes || true
          df -h /

      # Docker refuses mixed-case repository names, and github.repository keeps the
      # owner's capitalisation (R-luiz/OCR-app).
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry cache needs a BuildKit builder; the default docker driver cannot
      # export one.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Every build pushes its commit's tag; only main moves :latest. Only main writes
      # the layer cache that every build reads, so the ~10 GB weights layer keeps its
      # digest from one build to the next.
      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:latest', env.IMAGE) || '' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
          provenance: false
