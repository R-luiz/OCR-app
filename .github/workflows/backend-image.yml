name: Backend image

on:
  push:
    branches: ["**"]
    # Only the files that actually end up in the image. Rebuilding is a ~25 minute,
    # ~8.8 GB job, so it must not fire for changes to the deploy or test scripts,
    # which the Dockerfile never copies.
    paths:
      - "backend/Dockerfile"
      - "backend/requirements.txt"
      - "backend/handler.py"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pillow pytest

      - name: Unit tests
        run: python -m pytest test_handler.py -q
        working-directory: backend

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # The vLLM base image is very large (CUDA runtime + torch). A stock runner
      # has ~14 GB free, which is not enough; this reclaims ~25 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true
          df -h /

      # Docker refuses mixed-case repository names, and github.repository keeps the
      # owner's capitalisation (R-luiz/OCR-app).
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          provenance: false
