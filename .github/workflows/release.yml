name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "dist/ocr-app-${{ inputs.tag }}.apk"
          ls -la dist

      # Proves the shipped binary carries no RunPod credentials. CI has no
      # local.properties, so BuildConfig should hold empty strings — this asserts it
      # rather than assuming it.
      - name: Verify no credentials in the APK
        run: |
          if strings "dist/ocr-app-${{ inputs.tag }}.apk" | grep -qE '\brpa_[A-Za-z0-9]{16,}'; then
            echo "::error::A RunPod API key appears to be embedded in the APK."
            exit 1
          fi
          echo "No RunPod key pattern found in the APK."

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: OCR App ${{ inputs.tag }}
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Sideloadable Android APK.

            **This is a debug-signed build.** It installs directly on a device with
            "install from unknown sources" enabled, but it is signed with the standard
            Android debug key and is marked debuggable — fine for trying the app, not
            appropriate for public distribution. Producing a properly signed release
            build needs a keystore, which is deliberately not committed to this repo.

            No RunPod credentials are embedded; the build asserts this. Enter your
            endpoint ID and API key under **Settings** in the app.

            Quick scan works offline with no configuration. Document parsing needs a
            RunPod endpoint — see the README.
