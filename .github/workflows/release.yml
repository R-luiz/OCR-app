name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching versionName, e.g. v0.3.0"
        type: string
        required: true

permissions:
  contents: read

jobs:
  # The signing secrets are repository secrets, and a dispatch runs the workflow and the
  # Gradle build of whichever ref it names. Only main may reach them: a dispatch on any
  # other ref fails here, visibly, instead of being silently skipped.
  refuse:
    name: Refuse refs other than main
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse refs other than main
        run: |
          echo "::error::Release APK runs on main only. Dispatch it from main."
          exit 1

  # Gradle, its plugins and every dependency they pull run here, with no signing secret
  # and a read-only token. Without OCR_KEYSTORE_FILE the build signs with the runner's
  # debug key; the sign job replaces that signature on a fresh runner, so nothing the
  # build leaves running can reach the release key.
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check version
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"$/\1/p' android/app/build.gradle.kts)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$RELEASE_TAG" != "v$version" ]]; then
            echo "::error::Release tag must match versionName (v$version)."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest
        working-directory: android

      # One APK per ABI: a phone loads the native libraries of one ABI only, and the
      # other ABI's are a third of a two-ABI APK. Both builds write the same output
      # path, so each APK is copied out before the next build.
      - name: Build release APKs
        working-directory: android
        shell: bash
        run: |
          mkdir -p ../dist
          for abi in arm64-v8a armeabi-v7a; do
            ./gradlew assembleRelease -Pocr.releaseAbis="$abi"
            cp app/build/outputs/apk/release/app-release.apk "../dist/ocr-app-$RELEASE_TAG-$abi.apk"
          done

      - name: Upload release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apks-debug-signed
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  # The only job that sees the signing secrets. It checks out and builds nothing: the
  # runner's own apksigner replaces the debug signature, and only its sign step
  # receives the secrets.
  sign:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download release APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apks-debug-signed
          path: dist

      - name: Sign release APKs
        shell: bash
        env:
          OCR_KEYSTORE_BASE64: ${{ secrets.OCR_KEYSTORE_BASE64 }}
          OCR_KEYSTORE_PASSWORD: ${{ secrets.OCR_KEYSTORE_PASSWORD }}
          OCR_KEY_ALIAS: ${{ secrets.OCR_KEY_ALIAS }}
          OCR_KEY_PASSWORD: ${{ secrets.OCR_KEY_PASSWORD }}
        run: |
          : "${OCR_KEYSTORE_BASE64:?Missing release keystore}"
          : "${OCR_KEYSTORE_PASSWORD:?Missing release keystore password}"
          : "${OCR_KEY_ALIAS:?Missing release key alias}"
          : "${OCR_KEY_PASSWORD:?Missing release key password}"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          if [ ! -x "$build_tools/apksigner" ]; then
            echo "::error::No apksigner under $ANDROID_HOME/build-tools."
            exit 1
          fi
          keystore=$(mktemp "$RUNNER_TEMP/ocr-keystore.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$OCR_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Signs in place, replacing the debug signature. apksigner reads both
          # passwords from the environment, so neither is on a command line.
          for apk in dist/*.apk; do
            "$build_tools/apksigner" sign --ks "$keystore" \
              --ks-pass env:OCR_KEYSTORE_PASSWORD \
              --ks-key-alias "$OCR_KEY_ALIAS" \
              --key-pass env:OCR_KEY_PASSWORD \
              --v4-signing-enabled false \
              "$apk"
          done

      - name: Upload signed APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-apks
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 1

  # Holds the write token but no signing secret.
  publish:
    needs: sign
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # SHA-256 of the certificate that signed v0.3.0. Android installs an update only
      # when it is signed with the same certificate.
      RELEASE_CERT_SHA256: d955e337ca106cd40052c55a204171e8757742d7a162a5688ad8247c9b6fcbce

    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-apks
          path: dist

      - name: Verify the release certificate
        shell: bash
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for apk in dist/*.apk; do
            digests=$("$build_tools/apksigner" verify --print-certs "$apk" \
              | sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p')
            if [ "$digests" != "$RELEASE_CERT_SHA256" ]; then
              echo "::error::$apk is not signed by the release certificate alone (signers: ${digests:-none})."
              exit 1
            fi
            echo "$apk: signed by the release certificate."
          done

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: OCR App ${{ inputs.tag }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Signed Android release APKs (Android 9+). Download the one for your phone:

            - `ocr-app-${{ inputs.tag }}-arm64-v8a.apk`: nearly every phone from 2017 on.
            - `ocr-app-${{ inputs.tag }}-armeabi-v7a.apk`: only older 32-bit phones, or a
              phone that refuses to install the arm64-v8a APK.

            Android cannot update a debug-signed installation with these APKs.

            Quick scan works offline with no configuration. Document parsing signs in with
            the owner's GitHub account through the OCR gateway: there is no RunPod key in
            the app. Users with their own endpoint can still enter it under **Settings →
            Advanced**, using a RunPod Restricted key limited to that endpoint.
