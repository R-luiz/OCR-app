# Provisions billable GPU capacity, so this is manual-only — never on push.
name: Deploy RunPod endpoint

on:
  workflow_dispatch:
    inputs:
      action:
        description: "dry-run/health-check/purge-queue create or change nothing (purge-queue only clears stuck queued jobs)"
        type: choice
        options:
          - dry-run
          - deploy
          - deploy-and-smoke-test
          - health-check
          - purge-queue
          - recycle-workers
        default: dry-run
      network_volume_id:
        description: "Network volume ID (strongly recommended — without one, every cold start re-downloads ~6.7 GB of weights)"
        type: string
        required: false
      endpoint_id:
        description: "Endpoint ID to read (health-check/purge-queue actions only)"
        type: string
        required: false
      image_tag:
        description: "Image tag to deploy. Defaults to this ref's commit SHA — an immutable tag, unlike :latest"
        type: string
        required: false
      smoke_test_pages:
        description: "Pages to send in the smoke test. >1 exercises the multi-page path the app uses for every PDF"
        type: string
        required: false
      idle_timeout:
        description: "Seconds to hold a worker after a job (default 300). Higher = fewer cold starts, more idle GPU billed"
        type: string
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install runpod

      # Deploying ":latest" is not safe here. It is mutable, so the tag can still point
      # at the previous build while a rebuild is in flight, and a warm RunPod worker will
      # happily keep serving the image it already pulled — a deploy that silently changes
      # nothing. That exact pair of failures sent a "fixed" worker back with the identical
      # error and the same workerId. An immutable per-commit tag makes each deploy a
      # genuinely distinct image reference, so the worker has to pull it.
      # Only the actions that actually deploy an image need one. health-check,
      # purge-queue and recycle-workers operate on the existing endpoint, and gating
      # them on an image would block exactly when they are most needed: this step
      # failed a recycle-workers run because the current commit, being workflow-only,
      # never built an image of its own.
      - name: Resolve the image reference
        if: contains(fromJSON('["dry-run","deploy","deploy-and-smoke-test"]'), inputs.action)
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker:${TAG}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Deploying ${IMAGE}"

      # A tag that does not exist yet yields a worker stuck pulling forever, so fail here
      # instead: the usual cause is racing a still-running image build.
      - name: Verify the image exists
        if: contains(fromJSON('["dry-run","deploy","deploy-and-smoke-test"]'), inputs.action)
        run: |
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker"
          TAG="${IMAGE##*:}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${TAG}")
          if [ "$CODE" != "200" ]; then
            echo "::error::Image ${IMAGE} is not in the registry (HTTP ${CODE})." \
                 "Either a backend-image build for this commit is still running (wait, then re-run)," \
                 "or this commit never built an image — only changes to the Dockerfile," \
                 "requirements.txt or handler.py do. In that case pass image_tag explicitly," \
                 "using the SHA of the last commit that did."
            exit 1
          fi
          echo "Image manifest found."

      - name: Check for the API key
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "::error::RUNPOD_API_KEY secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then re-run." \
                 "Create a key at https://console.runpod.io/user/settings."
            exit 1
          fi
          echo "API key is present."

      - name: Dry run
        if: inputs.action == 'dry-run'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
        run: python backend/deploy_runpod.py --dry-run --image "$IMAGE"

      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
        run: |
          IDLE="${{ inputs.idle_timeout }}"
          python backend/deploy_runpod.py --confirm --image "$IMAGE" \
            ${IDLE:+--idle-timeout "$IDLE"}

      # Deploys, then submits a real page and waits for markdown. This is the
      # first time Unlimited-OCR actually runs — CI has no GPU of its own.
      - name: Deploy and smoke test
        if: inputs.action == 'deploy-and-smoke-test'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
        run: |
          PAGES="${{ inputs.smoke_test_pages }}"
          if [ -z "$PAGES" ]; then PAGES=1; fi
          IDLE="${{ inputs.idle_timeout }}"
          python backend/deploy_runpod.py --confirm --image "$IMAGE" \
            --smoke-test android/app/src/androidTest/assets/sample_page.png \
            --smoke-test-pages "$PAGES" \
            ${IDLE:+--idle-timeout "$IDLE"}

      # Read-only: no job submitted, no GPU spent. The fast way to tell "worker
      # is still cold-starting" apart from "no worker is being scheduled at all".
      - name: Health check
        if: inputs.action == 'health-check'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python backend/deploy_runpod.py --health-check "${{ inputs.endpoint_id }}"

      # Clears stuck queued jobs only — no endpoint/template/worker config changes.
      - name: Purge queue
        if: inputs.action == 'purge-queue'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python backend/deploy_runpod.py --purge-queue "${{ inputs.endpoint_id }}"

      # Repointing an endpoint at a new template leaves its running workers alone, so
      # they keep serving the old image and a deploy can appear to succeed while
      # changing nothing. This drains them; the endpoint's config is restored after.
      - name: Recycle workers
        if: inputs.action == 'recycle-workers'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python backend/deploy_runpod.py --recycle-workers "${{ inputs.endpoint_id }}"
