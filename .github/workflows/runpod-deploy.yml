# Provisions billable GPU capacity, so this is manual-only — never on push.
name: Deploy RunPod endpoint

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deploy, verify OCR, or manage an existing endpoint"
        type: choice
        options:
          - dry-run
          - deploy
          - deploy-and-smoke-test
          - health-check
          - cancel-job
          - purge-queue
          - recycle-workers
        default: dry-run
      network_volume_id:
        description: "Optional network volume for a new endpoint. The image already contains the model weights."
        type: string
        required: false
      endpoint_id:
        description: "Endpoint ID for health-check, cancel-job, purge-queue or recycle-workers"
        type: string
        required: false
      image_tag:
        description: "Image tag to deploy. Defaults to this ref's commit SHA — an immutable tag, unlike :latest"
        type: string
        required: false
      smoke_test_pages:
        description: "Pages to send in the smoke test. >1 exercises the multi-page path the app uses for every PDF"
        type: string
        required: false
      idle_timeout:
        description: "Seconds to hold a worker after a job (default 300). Higher = fewer cold starts, more idle GPU billed"
        type: string
        required: false
      gpu_ids:
        description: "Override the GPU pools with a comma-separated list (deploy actions only)"
        type: string
        required: false
      init_timeout:
        description: "Seconds allowed to pull the image and initialize the worker (deploy actions only)"
        type: string
        required: false
      min_cuda_version:
        description: "Minimum CUDA version the GPU host must support (deploy actions only)"
        type: string
        required: false
      job_id:
        description: "Exact Runpod job ID to cancel (cancel-job only)"
        type: string
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install 'runpod>=2.4.0,<3'

      # Deploying ":latest" is not safe here. It is mutable, so the tag can still point
      # at the previous build while a rebuild is in flight, and a warm RunPod worker will
      # happily keep serving the image it already pulled — a deploy that silently changes
      # nothing. That exact pair of failures sent a "fixed" worker back with the identical
      # error and the same workerId. An immutable per-commit tag makes each deploy a
      # genuinely distinct image reference, so the worker has to pull it.
      # Only the actions that actually deploy an image need one. health-check,
      # purge-queue and recycle-workers operate on the existing endpoint, and gating
      # them on an image would block exactly when they are most needed: this step
      # failed a recycle-workers run because the current commit, being workflow-only,
      # never built an image of its own.
      - name: Resolve the image reference
        if: contains(fromJSON('["dry-run","deploy","deploy-and-smoke-test"]'), inputs.action)
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then TAG="${{ github.sha }}"; fi
          IMAGE="ghcr.io/$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker:${TAG}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          echo "Deploying ${IMAGE}"

      # A tag that does not exist yet yields a worker stuck pulling forever, so fail here
      # instead: the usual cause is racing a still-running image build.
      - name: Verify the image exists
        if: contains(fromJSON('["dry-run","deploy","deploy-and-smoke-test"]'), inputs.action)
        run: |
          TOKEN=$(curl -fsSL "https://ghcr.io/token?scope=repository:$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')/unlimited-ocr-worker"
          TAG="${IMAGE##*:}"
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json,application/vnd.oci.image.manifest.v1+json" \
            "https://ghcr.io/v2/${REPO}/manifests/${TAG}")
          if [ "$CODE" != "200" ]; then
            echo "::error::Image ${IMAGE} is not in the registry (HTTP ${CODE})." \
                 "Either a backend-image build for this commit is still running (wait, then re-run)," \
                 "or this commit never built an image — only changes to the Dockerfile," \
                 "requirements.txt or handler.py do. In that case pass image_tag explicitly," \
                 "using the SHA of the last commit that did."
            exit 1
          fi
          echo "Image manifest found."

      - name: Check for the API key
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          if [ -z "$RUNPOD_API_KEY" ]; then
            echo "::error::RUNPOD_API_KEY secret is not set. Add it under" \
                 "Settings -> Secrets and variables -> Actions, then re-run." \
                 "Create a key at https://console.runpod.io/user/settings."
            exit 1
          fi
          echo "API key is present."

      - name: Dry run
        if: inputs.action == 'dry-run'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
        run: python backend/deploy_runpod.py --dry-run --image "$IMAGE"

      - name: Deploy
        if: inputs.action == 'deploy'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
          GPU_IDS: ${{ inputs.gpu_ids }}
          IDLE: ${{ inputs.idle_timeout }}
          INIT_TIMEOUT: ${{ inputs.init_timeout }}
          CUDA_MIN: ${{ inputs.min_cuda_version }}
        run: |
          python backend/deploy_runpod.py --confirm --image "$IMAGE" \
            ${IDLE:+--idle-timeout "$IDLE"} ${GPU_IDS:+--gpu-ids "$GPU_IDS"} \
            ${INIT_TIMEOUT:+--init-timeout "$INIT_TIMEOUT"} ${CUDA_MIN:+--min-cuda-version "$CUDA_MIN"}

      # Submit fixture pages to the deployed endpoint; CI has no GPU of its own.
      - name: Deploy and smoke test
        if: inputs.action == 'deploy-and-smoke-test'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RUNPOD_NETWORK_VOLUME_ID: ${{ inputs.network_volume_id }}
          PAGES: ${{ inputs.smoke_test_pages }}
          IDLE: ${{ inputs.idle_timeout }}
          GPU_IDS: ${{ inputs.gpu_ids }}
          INIT_TIMEOUT: ${{ inputs.init_timeout }}
          CUDA_MIN: ${{ inputs.min_cuda_version }}
        run: |
          if [ -z "$PAGES" ]; then PAGES=1; fi
          FIXTURES=android/app/src/androidTest/assets
          IMAGES=("$FIXTURES/sample_page.png")
          if [ "$PAGES" -gt 1 ]; then
            python -m pip install pypdfium2 pillow
            python - "$FIXTURES/sample_doc.pdf" "$RUNNER_TEMP" <<'PY'
          import sys
          from pathlib import Path

          import pypdfium2

          document = pypdfium2.PdfDocument(sys.argv[1])
          for index, page in enumerate(document, 1):
              page.render(scale=1.5).to_pil().save(Path(sys.argv[2]) / f"ocr-page-{index}.png")
          PY
            IMAGES=("$RUNNER_TEMP/ocr-page-1.png" "$RUNNER_TEMP/ocr-page-2.png")
          fi
          python -u backend/deploy_runpod.py --confirm --image "$IMAGE" \
            --smoke-test "${IMAGES[@]}" \
            --smoke-test-pages "$PAGES" \
            --smoke-test-timeout 900 \
            ${IDLE:+--idle-timeout "$IDLE"} ${GPU_IDS:+--gpu-ids "$GPU_IDS"} \
            ${INIT_TIMEOUT:+--init-timeout "$INIT_TIMEOUT"} ${CUDA_MIN:+--min-cuda-version "$CUDA_MIN"}

      # Read-only: no job submitted, no GPU spent. The fast way to tell "worker
      # is still cold-starting" apart from "no worker is being scheduled at all".
      - name: Health check
        if: inputs.action == 'health-check'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ENDPOINT_ID: ${{ inputs.endpoint_id }}
        run: |
          python backend/deploy_runpod.py --health-check "$ENDPOINT_ID"
          if [ -z "$ENDPOINT_ID" ]; then exit 0; fi
          python - "$ENDPOINT_ID" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys

          from runpod.api.rest import run_rest_request

          endpoint_path = f"/v2/serverless/{sys.argv[1]}"
          endpoint = run_rest_request("GET", endpoint_path)
          print("Placement:", json.dumps({"gpu": endpoint["gpu"], "workers": endpoint["workers"]}))
          print("Placement restrictions:", json.dumps({
              "dataCenterIds": endpoint["dataCenterIds"],
              "networkVolumeCount": len(endpoint["networkVolumes"]),
          }))
          path = f"{endpoint_path}/workers"
          state = run_rest_request("GET", path)
          print(f"Endpoint version: {state.get('endpointVersion')}")
          if not state["workers"] and endpoint["gpu"]:
              gpu = endpoint["gpu"]
              filters = {"include": "AVAILABILITY", "product": "SERVERLESS", "count": gpu["count"]}
              if gpu.get("minCudaVersion"):
                  filters["minCudaVersion"] = gpu["minCudaVersion"]
              catalog = run_rest_request("GET", "/v2/catalog/gpus", params=filters)
              available = {item["id"]: item.get("availability") for item in catalog["gpus"]
                           if item.get("pool") in gpu["pools"]}
              print("Serverless GPU availability:", json.dumps(available))
          # Public Actions logs: report stage markers, never raw container logs.
          markers = {
              "starting worker:": "OCR entrypoint",
              "starting serverless worker": "Runpod SDK started",
              "completed model loading": "model loaded",
              "out of memory": "out of memory",
              "runtimeerror": "runtime error",
              "modulenotfounderror": "missing dependency",
              "traceback": "exception",
              "failed to get job": "job fetch failed",
              "error fetching job": "job fetch failed",
              "error getting job": "job fetch failed",
              "pulling image": "image pull started",
              "initialization timeout": "initialization timeout",
              "nvidia-container-cli": "Nvidia container startup error",
              "no space left on device": "insufficient disk space",
              "no kernel image is available": "CUDA kernel unavailable for this GPU",
              "unsupported compute capability": "GPU architecture unsupported",
              "driver version is insufficient": "CUDA driver incompatible",
              "no cuda gpus are available": "CUDA device missing",
              "failed to infer device type": "vLLM device detection failed",
              "no available memory for the cache blocks": "insufficient KV cache memory",
              "no available kv cache memory": "insufficient KV cache memory",
              "higher than the maximum number of tokens that can be stored in kv cache": "context exceeds KV cache capacity",
              "model architectures": "model architecture registration",
              "engine core initialization failed": "vLLM engine startup failed",
              "cuda error": "CUDA error",
              "cannot import name": "Python import incompatibility",
              "undefined symbol": "incompatible shared library",
              "cannot open shared object file": "missing shared library",
              "localentrynotfounderror": "missing offline model file",
              "can't load tokenizer": "tokenizer unavailable",
              "not supported on this device": "GPU feature unsupported",
              "pydantic_core": "configuration validation",
              "can't pickle": "vLLM process serialization failed",
          }
          frame = re.compile(
              r'File "/[^"]*?/?((?:app|vllm|torch|transformers|transformers_modules|'
              r'runpod|pydantic|huggingface_hub|flashinfer)/[A-Za-z0-9_./-]+\.py)", '
              r'line (\d+), in ([A-Za-z0-9_<>]+)'
          )
          error = re.compile(r"\b([A-Z][A-Za-z_0-9]*(?:Error|Exception)):")
          for worker in state["workers"]:
              fields = ("id", "status", "isStale", "version", "image", "gpuTypeId", "uptimeSeconds")
              print(json.dumps({key: worker.get(key) for key in fields}))
              if worker.get("isStale"):
                  continue
              result = subprocess.run(
                  ["curl", "-fsS", "--max-time", "8", "--write-out", "\nHTTP %{http_code}\n", "-H",
                   f"Authorization: Bearer {os.environ['RUNPOD_API_KEY']}",
                   f"https://api.runpod.io{path}/{worker['id']}/logs?source=container&tail=2000"],
                  capture_output=True, text=True,
              )
              lines = []
              for entry in result.stdout.splitlines():
                  if not entry.startswith("data:"):
                      continue
                  try:
                      event = json.loads(entry[5:])
                  except json.JSONDecodeError:  # The stream may end mid-event at curl's deadline.
                      continue
                  if event.get("source") in ("container", "system"):
                      lines.extend(event["line"].splitlines())
              lower_lines = [line.lower() for line in lines]
              stages = {label for marker, label in markers.items()
                        if any(marker in line for line in lower_lines)}
              frames = list(dict.fromkeys(":".join(match.groups()) for line in lines
                                          if (match := frame.search(line))))
              errors = sorted({match[1] for line in lines for match in error.finditer(line)})
              status = result.stdout.rpartition("\nHTTP ")[2].strip()
              print("Worker log stream HTTP:", status if status.isascii() and status.isdigit() else "unknown")
              print("Worker stages:", ", ".join(sorted(stages)) or "none visible")
              print("Worker log line count:", len(lines))
              if errors:
                  print("Worker exception types:", ", ".join(errors))
              if frames:
                  print("Worker traceback frames:", ", ".join(frames[-20:]))
          PY

      - name: Cancel one job
        if: inputs.action == 'cancel-job'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ENDPOINT_ID: ${{ inputs.endpoint_id }}
          JOB_ID: ${{ inputs.job_id }}
        run: |
          set -o pipefail
          [[ "$ENDPOINT_ID" =~ ^[A-Za-z0-9]+$ && "$JOB_ID" =~ ^[A-Za-z0-9-]+$ ]] ||
            { echo "::error::Pass the endpoint ID and exact job ID to cancel."; exit 1; }
          curl -fsS --max-time 20 -X POST -H "Authorization: Bearer $RUNPOD_API_KEY" \
            "https://api.runpod.ai/v2/$ENDPOINT_ID/cancel/$JOB_ID" |
            jq -e 'select(.status == "CANCELLED") | {id, status}'

      # Clears stuck queued jobs only — no endpoint/template/worker config changes.
      - name: Purge queue
        if: inputs.action == 'purge-queue'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python backend/deploy_runpod.py --purge-queue "${{ inputs.endpoint_id }}"

      # Manually substitute fresh workers if some are still on an old release.
      - name: Recycle workers
        if: inputs.action == 'recycle-workers'
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: python backend/deploy_runpod.py --recycle-workers "${{ inputs.endpoint_id }}"
