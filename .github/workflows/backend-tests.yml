# Fast checks for everything under backend/, including the scripts that never
# enter the Docker image. The expensive image rebuild lives in backend-image.yml
# and is scoped to the files the Dockerfile actually copies.
name: Backend tests

on:
  # Branch commits run through their pull request; pushing to a branch as well would
  # run every commit twice.
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # The worker's own pinned requirements, so the tests run the library versions
      # the image ships.
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt pytest==9.2.0

      - name: Unit tests
        run: python -m pytest test_handler.py test_postprocess.py test_deploy_runpod.py -q
        working-directory: backend

      # Catches syntax errors and bad imports in the scripts that have no test
      # coverage of their own.
      - name: Import check the scripts
        run: |
          python -m py_compile backend/deploy_runpod.py backend/test_local.py
          python backend/deploy_runpod.py --help > /dev/null
          echo "scripts import and parse arguments cleanly"
