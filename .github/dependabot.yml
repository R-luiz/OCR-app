version: 2
updates:
  # The workflows pin every action to a commit SHA; this keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /gateway
    schedule:
      interval: weekly
